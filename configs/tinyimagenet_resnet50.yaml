task: classification
dataset: imagefolder

model:
  name: resnet50
  pretrained: false
  num_classes: 200
  img_size: 64

train:
  epochs: 50
  batch_size: 128
  optimizer: sgd
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  scheduler: cosine
  warmup_epochs: 5
  amp: true
  label_smoothing: 0.1
  mixup_alpha: 0.2
  cutmix_alpha: 0.2
  gradient_clip: 0.0

data:
  num_workers: 8
  pin_memory: true
  img_size: 64
  randaugment: true
  randaugment_n: 2
  randaugment_m: 9

paths:
  data_dir: ./data/tiny-imagenet-200
  output_dir: runs/tinyimagenet_resnet50
  log_dir: runs/tinyimagenet_resnet50/logs

eval:
  batch_size: 256

seed: 42
deterministic: true
