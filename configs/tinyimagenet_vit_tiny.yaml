task: classification
dataset: imagefolder

model:
  name: vit_tiny
  pretrained: false
  num_classes: 200
  img_size: 64
  patch_size: 4

train:
  epochs: 50
  batch_size: 128
  optimizer: adamw
  lr: 0.0005
  weight_decay: 0.05
  scheduler: cosine
  warmup_epochs: 5
  amp: true
  label_smoothing: 0.1
  mixup_alpha: 0.2
  cutmix_alpha: 0.2
  gradient_clip: 1.0

data:
  num_workers: 8
  pin_memory: true
  img_size: 64
  randaugment: true
  randaugment_n: 2
  randaugment_m: 9

paths:
  data_dir: ./data/tiny-imagenet-200
  output_dir: runs/tinyimagenet_vit_tiny
  log_dir: runs/tinyimagenet_vit_tiny/logs

eval:
  batch_size: 256

seed: 42
deterministic: true
